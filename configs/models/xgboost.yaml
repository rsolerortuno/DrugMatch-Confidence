regression:
  objective: reg:squarederror
  n_estimators: 250
  learning_rate: 0.04
  max_depth: 3
  min_child_weight: 3
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 0.05
  reg_lambda: 1.0
  n_jobs: 4
classification:
  objective: binary:logistic
  eval_metric: logloss
  n_estimators: 250
  learning_rate: 0.04
  max_depth: 3
  min_child_weight: 3
  subsample: 0.85
  colsample_bytree: 0.75
  reg_alpha: 0.05
  reg_lambda: 1.0
  n_jobs: 4
