[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugmatch-confidence"
version = "1.0.1"
description = "Interpretable and uncertainty-aware prediction of preclinical cancer drug response."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rafael Soler Ortuño"}]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "shap>=0.45",
  "typer>=0.12",
  "xgboost>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8", "pytest-cov>=5", "ruff==0.16.0"]

[project.scripts]
drugmatch = "drugmatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
    
[tool.ruff.lint.per-file-ignores]
"src/drugmatch/cli.py" = ["B008"]
